name: Build APK

# The build itself is shared by every Newt app: see newt-app.yml in
# https://github.com/sec-newt/newt-android-lib. It runs the tests, screenshots,
# accessibility checks, lint, secret scan and permission check, builds the test APK,
# and publishes a signed release from main.

on:
  # Pushes to main build the APK; other branches are checked through their pull request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newt:
    name: Newt
    uses: sec-newt/newt-android-lib/.github/workflows/newt-app.yml@ca24dc1e6105d0a41e3213ac1f38a7beb83efb04 # v1.3.1
    # The app's names, used for the test APK and release files. scripts/new-app.sh sets these.
    with:
      app-slug: newt-maps
      app-name: Newt Maps
    secrets:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    # The most any shared job needs: publishing a release writes, CodeQL reports security
    # findings. Each job inside newt-app.yml asks only for what it uses.
    permissions:
      contents: write
      packages: read
      actions: read
      security-events: write

  # Newt Maps only: screenshots of the real map, which needs an emulator's graphics and
  # internet for the map tiles. The pictures are uploaded as "map-screenshots".
  emulator:
    name: Emulator map screenshots
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: newt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: newt-maps-test-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshot the map
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/emulator-map-screenshots.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: map-screenshots
          path: shots/
